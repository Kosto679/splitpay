spring.application.name=splitpay
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:9000}
server.forward-headers-strategy=native
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=SPLITPAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.mime-mappings.webmanifest=application/manifest+json
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=64
server.tomcat.accept-count=16

spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/splitpay;CACHE_SIZE=4096
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.jackson.property-naming-strategy=SNAKE_CASE

splitpay.password=${APP_PASSWORD:}
splitpay.ingest-token=${INGEST_TOKEN:}
splitpay.public-url=${PUBLIC_URL:}
splitpay.timezone=${TZ:Europe/Athens}
